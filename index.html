
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Club</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <main class="container">

        <header>
            <h2 class="logo">HAMBURGUESAS</h2>
        </header>

        <section class="hero">

            <div class="content">
                <p class="subtitle">THE ULTIMATE</p>
                <h1>BURGER<br>CLUB</h1>
                <p class="description">
                    Disfruta el sabor,<br>
                    entra al club.
                </p>
            </div>

            <div class="burger-display">

                <input type="radio" name="burger" id="burger1" checked>
                <input type="radio" name="burger" id="burger2">
                <input type="radio" name="burger" id="burger3">
                <input type="radio" name="burger" id="burger4">

                <div class="main-burger burger-one">
                    <img src="assets/burger1.png" alt="Hamburguesa clásica">
                </div>

                <div class="main-burger burger-two">
                    <img src="assets/burger2.png" alt="Hamburguesa doble">
                </div>

                <div class="main-burger burger-three">
                    <img src="assets/burger3.png" alt="Hamburguesa especial">
                </div>

                <div class="main-burger burger-four">
                    <img src="assets/burger4.png" alt="Hamburguesa con queso">
                </div>

                <div class="thumbnails">

                    <label for="burger1">
                        <img src="assets/burger1.png" alt="Hamburguesa 1">
                    </label>

                    <label for="burger2">
                        <img src="assets/burger2.png" alt="Hamburguesa 2">
                    </label>

                    <label for="burger3">
                        <img src="assets/burger3.png" alt="Hamburguesa 3">
                    </label>

                    <label for="burger4">
                        <img src="assets/burger4.png" alt="Hamburguesa 4">
                    </label>

                </div>

                <div class="indicators">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
